openapi: 3.1.0
info:
  title: Orpheus RAG Retrieval API
  version: 0.1.0
  description: Read-only access to RAGFlow datasets and retrieval for a custom GPT Action.
servers:
  - url: https://rag.example.com
security:
  - bearerAuth: []
paths:
  /api/v1/datasets:
    get:
      operationId: listDatasets
      summary: List available RAGFlow datasets
      description: Use this only when the dataset ID is unknown and the user explicitly asks to search the private knowledge base.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - in: query
          name: name
          schema:
            type: string
          description: Optional dataset name filter.
      responses:
        '200':
          description: Dataset list returned by RAGFlow
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/retrieval:
    post:
      operationId: retrieveKnowledge
      summary: Retrieve relevant chunks from selected RAGFlow datasets
      description: Search the user's private RAGFlow knowledge base. Only call this when the user explicitly asks to search, query, look up, verify against, or use the private knowledge base.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dataset_ids
                - question
              properties:
                dataset_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: RAGFlow dataset IDs to search.
                document_ids:
                  type: array
                  items:
                    type: string
                  description: Optional document IDs to restrict the search.
                question:
                  type: string
                  minLength: 1
                  description: The user's search question.
                page:
                  type: integer
                  minimum: 1
                  default: 1
                page_size:
                  type: integer
                  minimum: 1
                  maximum: 30
                  default: 8
                  description: Number of final chunks to return.
                similarity_threshold:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 0.2
                vector_similarity_weight:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 0.3
                  description: Weight of vector similarity in hybrid retrieval.
                keyword:
                  type: boolean
                  default: true
                  description: Enable keyword-aware retrieval for exact terms, acronyms, equipment tags, and procedure IDs.
                knn_top_k:
                  type: integer
                  minimum: 1
                  maximum: 2048
                  default: 1024
                  description: Number of vector candidates considered before final ranking.
      responses:
        '200':
          description: Retrieval result containing relevant chunks, document metadata, and similarity information.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: RAGFlow-API-Key
